---
name: Release Helm chart
run-name: "Helm for ${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches:
    - main
    paths:
    - 'charts/**'
    - '.github/workflows/helm.yaml'
  workflow_dispatch:

jobs:
  # ── GitHub Pages (classic helm repo) ──────────────────────────────────────
  release:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

    - uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
      with:
        charts_dir: charts
        skip_existing: true
      env:
        CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── GHCR OCI registry ─────────────────────────────────────────────────────
  oci:
    name: Publish to GHCR (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Package and push
      run: |
        helm package charts/namespace-admission --destination /tmp/helm
        helm push /tmp/helm/namespace-admission-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
