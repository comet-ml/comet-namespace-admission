apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "namespace-admission.fullname" . }}-webhook
webhooks:
  - name: {{ include "namespace-admission.fullname" . }}.{{ .Release.Namespace }}.svc
    clientConfig:
      service:
        name: {{ include "namespace-admission.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: 
    rules:
      - operations: ["CREATE","DELETE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
    admissionReviewVersions: ["v1"]
    sideEffects: "None"
    timeoutSeconds: 10
