{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  refreshInterval: {{ .refreshInterval | default "2h" | quote }}
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .template }}
    template:
    {{- . | toYaml | nindent 6 }}
    {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
