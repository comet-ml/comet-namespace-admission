{{- if .Values.serviceAccount.create -}}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "namespace-admission.serviceAccountName" . }}-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin # {{ include "namespace-admission.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "namespace-admission.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
