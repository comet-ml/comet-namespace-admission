---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "namespace-admission.serviceAccountName" . }}-ns-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "namespace-admission.serviceAccountName" . }}-ns-admin
subjects:
  - kind: User
    name: {{ .Values.userName }}
