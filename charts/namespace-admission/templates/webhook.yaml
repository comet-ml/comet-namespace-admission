apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "namespace-admission.fullname" . }}-webhook
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "namespace-admission.fullname" . }}
  {{- end }}
webhooks:
  - name: {{ include "namespace-admission.fullname" . }}.{{ .Release.Namespace }}.svc
    clientConfig:
      service:
        name: {{ include "namespace-admission.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: {{ .Values.caBundle | default "" | quote }}
    rules:
      - operations: ["CREATE","DELETE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
    admissionReviewVersions: ["v1"]
    sideEffects: "None"
    timeoutSeconds: 10
    failurePolicy: Ignore
